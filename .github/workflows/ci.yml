name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . || pip install pytest
      - name: Test
        shell: bash
        run: |
          if compgen -G "tests/*.py" > /dev/null; then
            python -m pytest -q
          else
            echo "no tests present — skipping"
          fi
      - name: Smoke — CLI surface
        shell: bash
        run: |
          python -m apidiff --version
          python -m apidiff diff demos/01-basic/openapi.old.json \
            demos/01-basic/openapi.new.json --format markdown --fail-on never
          python -m apidiff diff demos/01-basic/openapi.old.json \
            demos/01-basic/openapi.new.json --format junit --fail-on never

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (advisory)
        run: ruff check apidiff tests || true
      - name: Byte-compile (must pass)
        run: python -m compileall -q apidiff tests
